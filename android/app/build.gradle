plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing: android/key.properties (git-ignored) points at the upload
// keystore. See android/key.properties.example and docs/release-signing.md.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Never let a debug-signed prod bundle reach Google Play.
def buildsProdBundle = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("bundleprodrelease")
}
if (buildsProdBundle && !hasReleaseKeystore) {
    throw new GradleException(
        "android/key.properties is missing: prod release bundles must be signed " +
        "with the upload keystore. See docs/release-signing.md.")
}

android {
    flavorDimensions "app"
    productFlavors {
        local {
            dimension "app"
            applicationId "com.fldp.mobileApp.local"
            resValue "string", "app_name", "LevelUp Money Life Local"
        }
        dev {
            dimension "app"
            applicationId "com.fldp.mobileApp.dev"
            resValue "string", "app_name", "LevelUp Money Life Dev"
        }
        prod {
            dimension "app"
            applicationId "com.fldp.mobileApp"
            resValue "string", "app_name", "LevelUp Money Life"
        }
    }
    namespace = "com.fldp.mobileApp_standard"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.fldp.mobileApp_standard"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Falls back to debug keys only for local `flutter run --release`
            // and non-prod builds; prod bundles are blocked above.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
